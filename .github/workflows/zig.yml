name: Zig

on:
  push:
    branches: [zig]
  pull_request:
    branches: [zig]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install TLS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libmbedtls-dev libgnutls28-dev nettle-dev libwolfssl-dev zlib1g-dev libzstd-dev libnghttp2-dev libbrotli-dev libpsl-dev libidn2-dev libc-ares-dev cmake ninja-build pkg-config
          git clone --depth 1 --branch v0.15.5 https://github.com/rustls/rustls-ffi.git /tmp/rustls-ffi
          cargo build --release --manifest-path /tmp/rustls-ffi/Cargo.toml
          sudo cp /tmp/rustls-ffi/target/release/librustls_ffi.a /usr/lib/x86_64-linux-gnu/librustls.a
          rm -rf /tmp/rustls-ffi
          git clone --depth 1 --branch v1.12.0 --recurse-submodules --shallow-submodules https://github.com/ngtcp2/nghttp3.git /tmp/nghttp3
          cmake -S /tmp/nghttp3 -B /tmp/nghttp3/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu -DENABLE_LIB_ONLY=ON
          cmake --build /tmp/nghttp3/build
          sudo cmake --install /tmp/nghttp3/build
          rm -rf /tmp/nghttp3
          git clone --depth 1 --branch v1.16.0 --recurse-submodules --shallow-submodules https://github.com/ngtcp2/ngtcp2.git /tmp/ngtcp2
          cmake -S /tmp/ngtcp2 -B /tmp/ngtcp2/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu -DENABLE_LIB_ONLY=ON -DENABLE_GNUTLS=ON -DENABLE_OPENSSL=OFF
          cmake --build /tmp/ngtcp2/build
          sudo cmake --install /tmp/ngtcp2/build
          sudo ldconfig
          rm -rf /tmp/ngtcp2

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon zig/

      - name: Build and test (zero-dep default)
        run: zig build test --summary all

      - name: Run tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Build and test (-Dssl=openssl)
        run: zig build test -Dssl=openssl --summary all

      - name: Build and test (-Dssl=mbedtls)
        run: zig build test -Dssl=mbedtls --summary all

      - name: Build and test (-Dssl=gnutls)
        run: zig build test -Dssl=gnutls --summary all

      - name: Build and test (-Dssl=rustls)
        run: zig build test -Dssl=rustls --summary all

      - name: Build and test (-Dssl=wolfssl)
        run: zig build test -Dssl=wolfssl --summary all

      - name: Build and test (-Dzstd=true)
        run: zig build test -Dzstd=true --summary all

      - name: Run backend tests (brotli + psl + libidn2)
        run: zig build test-backends -Dbrotli=true -Dpsl=true -Didn=libidn2 --summary all

      - name: Run backend tests (c-ares + HTTPS-RR + OpenSSL)
        run: zig build test-backends -Dares=true -Dhttpsrr=true -Dssl=openssl --summary all

      - name: Run backend tests (threaded resolver + c-ares HTTPS-RR + OpenSSL)
        run: zig build test-backends -Dares=true -Dhttpsrr=true -Dthreaded-resolver=true -Dssl=openssl --summary all

      - name: Run backend tests (OpenSSL + zlib + zstd + nghttp2 + brotli + psl + libidn2 + c-ares + HTTPS-RR)
        run: zig build test-backends -Dssl=openssl -Dzlib=true -Dzstd=true -Dnghttp2=true -Dbrotli=true -Dpsl=true -Didn=libidn2 -Dares=true -Dhttpsrr=true --summary all

      - name: Build and test (HTTP/3 ngtcp2 + GnuTLS)
        run: zig build test -Dquic=ngtcp2 -Dssl=gnutls --summary all

      - name: Run backend tests (HTTP/3 ngtcp2 + GnuTLS + c-ares + HTTPS-RR)
        run: zig build test-backends -Dquic=ngtcp2 -Dssl=gnutls -Dares=true -Dhttpsrr=true --summary all

      - name: Verify CLI --version
        run: |
          zig build run -- --version
          ./zig-out/bin/curl --version

  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            extra_args: ""
          - target: aarch64-linux-musl
            extra_args: ""
          - target: x86_64-windows-gnu
            extra_args: "-Dssl=schannel -Didn=winidn"
          - target: aarch64-windows-gnu
            extra_args: "-Dssl=schannel -Didn=winidn"
          - target: aarch64-macos
            extra_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Cross-compile (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra_args }} --summary all
