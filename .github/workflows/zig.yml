name: Zig

on:
  push:
    branches: [zig]
  pull_request:
    branches: [zig]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install TLS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libmbedtls-dev libgnutls28-dev nettle-dev libwolfssl-dev
          git clone --depth 1 --branch v0.15.5 https://github.com/rustls/rustls-ffi.git /tmp/rustls-ffi
          cargo build --release --manifest-path /tmp/rustls-ffi/Cargo.toml
          sudo cp /tmp/rustls-ffi/target/release/librustls_ffi.a /usr/lib/x86_64-linux-gnu/librustls.a
          rm -rf /tmp/rustls-ffi

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon zig/

      - name: Build and test (zero-dep default)
        run: zig build test --summary all

      - name: Run tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Build and test (-Dssl=openssl)
        run: zig build test -Dssl=openssl --summary all

      - name: Build and test (-Dssl=mbedtls)
        run: zig build test -Dssl=mbedtls --summary all

      - name: Build and test (-Dssl=gnutls)
        run: zig build test -Dssl=gnutls --summary all

      - name: Build and test (-Dssl=rustls)
        run: zig build test -Dssl=rustls --summary all

      - name: Build and test (-Dssl=wolfssl)
        run: zig build test -Dssl=wolfssl --summary all

      - name: Build and test (-Dzstd=true)
        run: zig build test -Dzstd=true --summary all

      - name: Verify CLI --version
        run: |
          zig build run -- --version
          ./zig-out/bin/curl --version

  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            extra_args: ""
          - target: aarch64-linux-musl
            extra_args: ""
          - target: x86_64-windows-gnu
            extra_args: "-Dssl=schannel"
          - target: aarch64-windows-gnu
            extra_args: "-Dssl=schannel"
          - target: aarch64-macos
            extra_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Cross-compile (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra_args }} --summary all
