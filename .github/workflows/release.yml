name: Release

on:
  push:
    tags:
      - 'v*.*.*-zig.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag & manifest contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build and test release tool
        run: zig build install-curl-release test-release -Doptimize=ReleaseSafe --summary all

      - name: Verify tag and manifest version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          zig-out/bin/curl_release verify-version \
            --tag "$GITHUB_REF_NAME" \
            --manifest build.zig.zon \
            --github-output "$GITHUB_OUTPUT"

  build:
    name: Build & verify (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-musl-x64
            runner: ubuntu-22.04
            target: x86_64-linux-musl
            executable: zig-out/bin/curl
            extra_args: ""
            run_smoke: "true"
          - platform: linux-musl-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-linux-musl
            executable: zig-out/bin/curl
            extra_args: ""
            run_smoke: "true"
          - platform: macos-x64
            runner: macos-15
            target: x86_64-macos
            executable: zig-out/bin/curl
            extra_args: ""
            run_smoke: "true"
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-macos
            executable: zig-out/bin/curl
            extra_args: ""
            run_smoke: "true"
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-windows-gnu
            executable: zig-out/bin/curl.exe
            extra_args: "-Dssl=schannel -Didn=winidn -Dldap=winldap -Dsspi=true"
            run_smoke: "true"
          - platform: windows-arm64
            runner: windows-latest
            target: aarch64-windows-gnu
            executable: zig-out/bin/curl.exe
            extra_args: "-Dssl=schannel -Didn=winidn -Dldap=winldap -Dsspi=true"
            run_smoke: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Ensure Rosetta for macos-x64 smoke tests
        if: matrix.platform == 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Build release tool
        run: zig build install-curl-release -Doptimize=ReleaseSafe --summary all

      - name: Build release binary (${{ matrix.platform }})
        shell: bash
        run: |
          set -euo pipefail
          zig build \
            -Doptimize=ReleaseSafe \
            -Dtarget=${{ matrix.target }} \
            -Dversion=${{ needs.verify.outputs.version }} \
            ${{ matrix.extra_args }} \
            --summary all

      - name: Package and verify release archive (${{ matrix.platform }})
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
          RUN_SMOKE: ${{ matrix.run_smoke }}
        run: |
          set -euo pipefail
          zig-out/bin/curl_release package \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --executable "$EXECUTABLE" \
            --copying COPYING \
            --output-dir dist
          zig-out/bin/curl_release verify-package \
            --archive "dist/curl-${VERSION}-${PLATFORM}.tar.gz" \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --run-smoke "$RUN_SMOKE"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: curl-${{ needs.verify.outputs.version }}-${{ matrix.platform }}
          path: dist/curl-${{ needs.verify.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish verified GitHub release
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build release tool
        run: zig build install-curl-release -Doptimize=ReleaseSafe --summary all

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: curl-${{ needs.verify.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify asset allowlist
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          zig-out/bin/curl_release verify-assets \
            --assets-directory release-assets \
            --version "$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/curl-${{ needs.verify.outputs.version }}-*.tar.gz

      - name: Re-verify asset allowlist before publication
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          zig-out/bin/curl_release verify-assets \
            --assets-directory release-assets \
            --version "$VERSION"

      - name: Publish verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          zig-out/bin/curl_release publish \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --assets-directory release-assets \
            --workspace "$GITHUB_WORKSPACE" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
